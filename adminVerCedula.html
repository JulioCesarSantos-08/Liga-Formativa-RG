<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075c54"><title>Revisar cédula · Río Grande</title><link rel="icon" href="imagenes/logo.png"><link rel="stylesheet" href="css/revisionCedulas.css"></head>
<body class="cr-page"><header class="cr-top"><a href="adminCedulas.html">← Cédulas</a><img src="imagenes/logo.png" alt="Liga Río Grande"><strong>Administración · Revisión de cédulas</strong></header>
<main class="cr-main"><p id="crEstado" class="cr-estado" role="status">Cargando cédula…</p><div id="crDetalle"></div><div id="crAcciones" class="cr-acciones" hidden><button id="crImprimir">Imprimir</button><a id="crEditar" class="cr-primario">Editar cédula</a><button id="crEditarDefault" class="cr-primario" hidden>Editar resolución por default</button><button id="crDevolver" class="cr-peligro">Devolver para corrección</button></div><section id="crHistorial" class="cr-card" hidden></section></main>
<dialog id="crDialogo"><form id="crFormulario"><h2 id="crDialogoTitulo">Devolver cédula para corrección</h2><p id="crExplicacion">El árbitro verá el motivo y conservará lo capturado. Se retirará el resultado oficial y se actualizarán las estadísticas hasta que vuelva a enviar la cédula.</p><div id="crCamposDefault" hidden><label for="crGanador">Ganador por default</label><select id="crGanador"><option value="local">Local</option><option value="visitante">Visitante</option></select><label for="crMotivoDefault">Motivo del default</label><textarea id="crMotivoDefault" rows="3" maxlength="600"></textarea></div><label for="crMotivo">Motivo de la devolución</label><textarea id="crMotivo" required minlength="8" maxlength="1000" rows="4" placeholder="Explica qué debe corregir el árbitro."></textarea><p id="crDialogoEstado" role="status"></p><div class="cr-acciones"><button type="button" id="crCancelar">Cancelar</button><button type="submit" id="crConfirmar" class="cr-peligro">Confirmar devolución</button></div></form></dialog>
<script type="module" src="js/admin/verCedula.js"></script></body></html>
