<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis credenciales técnicas · Liga Río Grande</title>
    <link rel="stylesheet" href="css/credencialesArbitros.css">
    <style>
        * {
            box-sizing:border-box;
        }

        body {
            margin:0;
            background:#f0e3c3;
            color:#153d35;
            font-family:Arial,sans-serif;
        }

        .ct-navegacion {
            display:flex;
            align-items:center;
            gap:16px;
            padding:16px;
            background:#075a4c;
            color:#fff;
        }

        .ct-navegacion a {
            color:inherit;
            font-weight:700;
        }

        .ct-navegacion img {
            width:48px;
            height:48px;
            object-fit:contain;
        }

        .jefes-contenido {
            max-width:1180px;
            margin:auto;
            padding:16px;
        }

        .ct-ayuda {
            line-height:1.5;
            margin:0 0 16px;
        }

        @media print {
            .ct-navegacion,
            .ct-ayuda {
                display:none !important;
            }
        }
    
        .ct-navegacion {
            --ct-boton-volver:1;
            flex-wrap:wrap;
        }

        .ct-navegacion a {
            display:inline-flex;
            align-items:center;
            justify-content:center;
            min-height:44px;
            padding:10px 16px;
            border:1px solid #e4c777;
            border-radius:12px;
            background:#f5e6bd;
            color:#164d3e;
            text-decoration:none;
            font-size:14px;
            font-weight:800;
            box-shadow:0 3px 8px #002e2926;
            transition:background .15s, box-shadow .15s;
        }

        .ct-navegacion a:hover {
            background:#fff1cc;
            box-shadow:0 4px 12px #002e2940;
        }

        .ct-navegacion a:focus-visible {
            outline:3px solid #fff;
            outline-offset:3px;
        }

        .ct-navegacion > strong {
            flex:1;
            min-width:140px;
            line-height:1.3;
        }

        @media (max-width:480px) {
            .ct-navegacion {
                gap:10px;
                padding:12px;
            }

            .ct-navegacion a {
                flex-basis:100%;
            }

            .ct-navegacion img {
                width:40px;
                height:40px;
            }
        }
    </style>
</head>
<body>
    <header class="ct-navegacion">
        <a href="jefeEquipo.html">← Volver a mi panel</a>
        <img src="imagenes/logo.png" alt="Liga Río Grande">
        <strong>Credenciales del cuerpo técnico</strong>
    </header>

    <main class="jefes-contenido">
        <p class="ct-ayuda">
            Consulta tu credencial y las de los auxiliares de tus equipos.
            Selecciona una para verla o reúne varias para imprimirlas.
            En la ventana de impresión elige Guardar como PDF para
            descargarlas. Formato: cuatro por hoja carta vertical.
        </p>
    </main>

    <script
        type="module"
        src="js/admin/credencialesCuerpoTecnico.js"
    ></script>
</body>
</html>
